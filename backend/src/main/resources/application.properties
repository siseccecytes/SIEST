spring.application.name=mapa

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/indicadores_educativos?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:holahola}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET:cecytes-mapa-secret-key-2025-indicadores-educativos-seguro-256bits!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=8081

# CORS - orígenes permitidos
cors.allowed-origins=https://*.tunnelmole.net,http://localhost:3000

# Rutas de PDFs
pdfs.anexos=${PDFS_ANEXOS:anexosejecucion}
pdfs.oferta=${PDFS_OFERTA:ofertaeducativa}

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
