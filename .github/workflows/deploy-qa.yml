name: Deploy QA

# Cada push a la rama "qa" se despliega usando el runner self-hosted
# instalado en el propio servidor de QA. No se necesita SSH ni secretos.
on:
  push:
    branches:
      - qa

jobs:
  deploy:
    # Corre en el runner instalado en el servidor (etiqueta "qa").
    runs-on: [self-hosted, qa]
    steps:
      - name: Actualizar codigo y reconstruir contenedores
        run: |
          set -e
          cd "$PROJECT_PATH"
          git fetch origin qa
          git reset --hard origin/qa
          docker compose up -d --build
          docker image prune -f
        env:
          # Ruta donde esta clonado el repo en el servidor.
          # Se define como variable del runner (ver README, seccion 3).
          PROJECT_PATH: ${{ vars.PROJECT_PATH }}
